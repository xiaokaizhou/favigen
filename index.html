<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favigen — Free Favicon Generator (PNG + ICO + Apple Touch)</title>
  <meta name="description" content="Generate favicons in every size (16, 32, 48, 64, 128, 180, 192, 256, 512), ICO and Apple Touch icon. 100% client-side, private, no upload. Free forever." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>🔥 Favigen</h1>
      <p class="tag">Free favicon generator — PNG (16→512), ICO, Apple Touch. <strong>100% in your browser</strong>, nothing leaves your device.</p>
    </header>

    <section class="drop" id="drop">
      <input type="file" id="file" accept="image/*" hidden />
      <div class="drop-inner">
        <p><strong>Drop an image</strong> here, or <button class="link" id="pick">choose a file</button></p>
        <p class="hint">PNG / JPG / WEBP / SVG. Square works best. We scale for you.</p>
      </div>
    </section>

    <section class="controls" id="controls" hidden>
      <div class="row">
        <label class="chk"><input type="checkbox" id="bgTransparent" checked /> Transparent background</label>
        <label class="chk">Padding <input type="range" id="pad" min="0" max="30" value="0" /> <span id="padVal">0%</span></label>
        <label class="chk">Round <input type="range" id="round" min="0" max="50" value="0" /> <span id="roundVal">0%</span></label>
      </div>
      <div class="sizes" id="sizes"></div>
      <div class="actions">
        <button id="dlZip" class="primary">⬇ Download all (.zip)</button>
        <button id="dlIco">⬇ favicon.ico</button>
        <button id="dlApple">⬇ apple-touch-icon.png</button>
        <button id="reset" class="ghost">Reset</button>
      </div>
    </section>

    <section class="preview" id="preview" hidden>
      <h2>Preview</h2>
      <div class="prev-grid" id="prevGrid"></div>
    </section>

    <footer>
      <p>Open source · <a href="https://github.com/xiaokaizhou/favigen" id="repo">github.com/xiaokaizhou/favigen</a> · Built with Cloudflare Pages</p>
    </footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
